<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#f2e1cd"/>
    <title>age guesser</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Gaegu:wght@400;700&display=swap"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"/>
    <style>
      :root{--cream:#fbf3e8;--milk:#fffaf2;--latte:#f2e1cd;--oat:#e6cdb0;--caramel:#b9784a;--cocoa:#58392b;--mocha:#80594a;--butter:#faebc9;--d:Chewy,Gaegu,system-ui,sans-serif}
      *{box-sizing:border-box}
      body{min-height:100dvh;margin:0;padding:1.2rem;display:flex;flex-direction:column;align-items:center;text-align:center;font:clamp(1.2rem,1.12rem + .3vw,1.38rem)/1.45 Gaegu,"Patrick Hand",system-ui,sans-serif;color:var(--cocoa);background:linear-gradient(90deg,rgba(214,168,124,.2) 50%,transparent 50%) 0 0/44px 44px,linear-gradient(rgba(214,168,124,.2) 50%,transparent 50%) 0 0/44px 44px var(--cream);-webkit-tap-highlight-color:transparent}
      .container{width:min(100%,520px);margin:auto;padding:2rem 1.5rem;background:var(--milk);border:2px solid var(--oat);border-radius:30px;box-shadow:0 6px 0 var(--oat)}
      h1{margin:0 0 1.5rem;font:400 clamp(2.4rem,10vw,3.4rem)/1.1 var(--d);text-shadow:3px 3px 0 var(--butter)}
      input{width:100%;margin-bottom:1rem;padding:.5rem 1.2rem;font:inherit;text-align:center;color:var(--cocoa);background:#fff;border:2px solid var(--oat);border-radius:999px;box-shadow:0 4px 0 var(--oat);outline:0;transition:border-color .2s}
      input::placeholder{color:var(--mocha);opacity:.7}
      input:focus{border-color:var(--caramel)}
      button{padding:.4rem 1.6rem;font:1.35rem var(--d);color:var(--cocoa);background:var(--butter);border:2px solid var(--cocoa);border-radius:999px;box-shadow:0 5px 0 var(--cocoa);cursor:pointer;transition:transform .15s,box-shadow .15s,background-color .2s}
      button:hover{background:#fbe4a0;transform:translateY(-2px);box-shadow:0 7px 0 var(--cocoa)}
      button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cocoa)}
      #output{margin-top:1rem;color:var(--mocha)}
      #output img{display:block;max-width:100%;margin:1.2rem auto;border-radius:20px}
      #output p{margin:0;font-size:.9em}
      .loader{display:none;width:2.6rem;height:2.6rem;margin:1.2rem auto;border:4px solid var(--latte);border-top-color:var(--caramel);border-radius:50%;animation:spin 1s linear infinite}
      footer{margin-top:1.5rem;font-size:.85em;color:var(--mocha)}
      footer p{margin:0}
      footer i{color:var(--caramel);animation:beat 1.5s ease-in-out infinite}
      @keyframes beat{0%,50%,100%{scale:1}25%,75%{scale:1.2}}
      @keyframes spin{to{rotate:360deg}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
  </head>
  <body>
    <div class="container">
      <h1>age guesser</h1>
      <div id="inputContainer">
        <input type="number" id="ageInput" placeholder="enter ur age"/>
        <button id="guessBtn">guess my age</button>
      </div>
      <div id="output"></div>
      <div class="loader" id="loader"></div>
    </div>
    <footer>
      <p>a really useless (useful) tool...</p>
      <p>made kinda... with <i class="fas fa-heart"></i> by sleepychezz.</p>
    </footer>
    <audio id="bgm" src="bgm.mp3" loop></audio>
    <script>
      const $=id=>document.getElementById(id),out=$("output"),loader=$("loader"),bgm=$("bgm"),box=$("inputContainer")
      const steps=["starting system","connecting to server","preparing data","checking input","analyzing data","thinking","eating some snack cuz me hungry","continue thinking","searching for answer","guessing ur age","preparing output"]
      $("guessBtn").onclick=()=>{
        const age=$("ageInput").value
        if(!age||age<=0)return out.textContent="hey... pls enter a valid age."
        bgm.play().catch(()=>{})
        loader.style.display="block"
        box.style.display="none"
        out.textContent=""
        let i=0,d=0
        const t=setInterval(()=>{
          if(i<steps.length){
            d=(d+1)%4
            out.textContent=steps[i]+".".repeat(d)
            if(d==3)i++
            return
          }
          clearInterval(t)
          loader.style.display="none"
          out.innerHTML=`your age: ${age}<img src="some-stuff/uiiaa.gif" alt="gif"><p>btw... u just wasted 22 seconds of ur life...</p>`
          bgm.pause()
          bgm.currentTime=0
        },500)
      }
    </script>
  </body>
</html>
